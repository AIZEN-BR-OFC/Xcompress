  bad+=f;out.push((f?"✗ ":"✓ ")+M[id].n)}
 for(const[n,c]of Object.entries(ROP)){if(!c.every(i=>M[i]))continue;try{const u=ins.texto,e=await runChain(c,u);let d=e;for(let i=c.length-1;i>=0;i--)d=await M[c[i]].d(d);if(!eq(d,u)){bad++;out.push("✗ "+n)}}catch(e){bad++;out.push("✗ "+n+": "+e.message)}}
 const r=await compress(ins.texto,"t.txt",{mode:"fast",tron:5},null,null);if(!r.best||!(await unpack(r.best.box)).data.length){bad++;out.push("✗ contêiner XCX2")}else out.push("✓ contêiner XCX2 + TRON + verificação ("+r.best.sz+" B de "+ins.texto.length+")");
 out.push(bad?"RESULTADO: "+bad+" falha(s)":"RESULTADO: tudo passou");return out}
function hstats(u){u=u.subarray(0,1<<20);const r=[];let prev=0;for(let k=1;k<=4;k++){const m=new Map();for(let i=0;i+k<=u.length;i++){let key=0;for(let j=0;j<k;j++)key=key*256+u[i+j];m.set(key,(m.get(key)||0)+1)}const N=u.length-k+1;let h=0;for(const c of m.values())h-=c/N*Math.log2(c/N);r.push(h-prev);prev=h}return r}
async function sha(u){try{return[...new Uint8Array(await crypto.subtle.digest("SHA-256",u))].map(b=>b.toString(16).padStart(2,"0")).join("")}catch(e){return"indisponível"}}
/*END*/
</script>
<script>
const $=i=>document.getElementById(i);let FILE=null,OUT=null,XCX=null;
const log=m=>{$("log").textContent+=m+"\n";$("log").scrollTop=1e9};
const fmt=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB";
function dl(u,name){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([u]));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
$("f").onchange=async e=>{const f=e.target.files[0];if(!f)return;FILE={name:f.name,u:new Uint8Array(await f.arrayBuffer())};OUT=null;$("dl").disabled=true;
 $("info").textContent=f.name+" — "+fmt(FILE.u.length);$("go").disabled=false;$("tb").innerHTML="";
 const h=hstats(FILE.u);$("ana").textContent="CRC32: "+crc32(FILE.u).toString(16).padStart(8,"0")+"\nSHA-256: "+await sha(FILE.u)+"\nEntropia condicional (bits/byte, até 1 MB): H1="+h[0].toFixed(3)+"  H2="+h[1].toFixed(3)+"  H3="+h[2].toFixed(3)+"  H4="+h[3].toFixed(3);
 let t="";for(let i=0;i<Math.min(FILE.u.length,512);i+=16){const row=[...FILE.u.subarray(i,i+16)];t+=i.toString(16).padStart(6,"0")+"  "+row.map(b=>b.toString(16).padStart(2,"0")).join(" ").padEnd(48)+" "+row.map(b=>b>31&&b<127?String.fromCharCode(b):".").join("")+"\n"}$("hex").textContent=t};
$("go").onclick=async()=>{if(!FILE)return;$("go").disabled=true;$("log").textContent="";const t0=performance.now();
 try{const r=await compress(FILE.u,FILE.name,{mode:$("mode").value,tron:+$("tron").value},log,p=>log("busca: "+Math.round(p*100)+"%"));
  const tb=$("tb");tb.innerHTML="<tr><th>Rota</th><th>Tamanho</th><th>Razão</th><th>Verificação</th></tr>";
  for(const x of r.res){const tr=tb.insertRow();tr.insertCell().textContent=cname(x.chain);tr.insertCell().textContent=x.sz?fmt(x.sz):"-";tr.insertCell().textContent=x.sz&&FILE.u.length?(x.sz/FILE.u.length*100).toFixed(1)+"%":"-";
   const c=tr.insertCell();c.textContent=x.ok?"restauração idêntica":"falhou"+(x.err?": "+x.err:"");c.className=x.ok?"ok":"er"}
  OUT=r.best;$("dl").disabled=!OUT;log("concluído em "+((performance.now()-t0)/1000).toFixed(1)+" s"+(OUT&&OUT.sz>=FILE.u.length+40?" — arquivo incompressível, o contêiner só adiciona o cabeçalho":""))}
 catch(e){log("ERRO: "+(e.message||e))}$("go").disabled=false};
$("dl").onclick=()=>OUT&&dl(OUT.box,FILE.name+".xcx");
$("f2").onchange=async e=>{const f=e.target.files[0];if(!f)return;XCX=new Uint8Array(await f.arrayBuffer());$("rs").disabled=false;$("rsi").textContent=f.name};
$("rs").onclick=async()=>{try{const r=await unpack(XCX);dl(r.data,r.name||"restaurado.bin");$("rsi").textContent="restaurado e conferido por CRC32 ("+fmt(r.data.length)+")"}catch(e){$("rsi").textContent="Erro: "+(e.message||e)}};
$("st").onclick=async()=>{$("st").disabled=true;$("stout").textContent="rodando...";try{$("stout").textContent=(await selfTest()).join("\n")}catch(e){$("stout").textContent="ERRO: "+e.message}$("st").disabled=false};
</script></body></html>
